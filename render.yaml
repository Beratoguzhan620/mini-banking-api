# The public demo on Render's free plan: one web service from the Dockerfile, with the database on Neon.
# Render asks for the database's connection string when the blueprint is first applied; nothing secret is in here.
services:
  - type: web
    name: mini-banking-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: ConnectionStrings__Banking
        sync: false
      - key: Jwt__SigningKey
        generateValue: true
      - key: Operations__ApiKey
        generateValue: true
      - key: Database__MigrateOnStartup
        value: "true"
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: PORT
        value: "8080"
