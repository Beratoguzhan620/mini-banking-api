name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MiniBanking.slnx

      - name: Build
        run: dotnet build MiniBanking.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/MiniBanking.UnitTests/MiniBanking.UnitTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Integration tests (PostgreSQL in Testcontainers)
        run: dotnet test tests/MiniBanking.IntegrationTests/MiniBanking.IntegrationTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Check for model changes without a migration
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          dotnet ef migrations has-pending-model-changes --project src/MiniBanking.Infrastructure --startup-project src/MiniBanking.Api --no-build --configuration Release

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Check the API
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health/ready > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8080/health/ready | grep -q "Healthy"
          curl -sf http://localhost:8080/openapi/v1.json | grep -q '"openapi"'

          api=http://localhost:8080/api
          json='Content-Type: application/json'
          curl -sf -X POST $api/auth/register -H "$json" -d '{"email":"smoke@example.com","fullName":"Smoke Test","password":"smoke-test-password"}' > /dev/null
          token=$(curl -sf -X POST $api/auth/login -H "$json" -d '{"email":"smoke@example.com","password":"smoke-test-password"}' | jq -r .accessToken)
          auth="Authorization: Bearer $token"
          account=$(curl -sf -X POST $api/accounts -H "$json" -H "$auth" -d '{"currency":"TRY"}' | jq -r .id)
          curl -sf -X POST $api/accounts/$account/deposits -H "$json" -H "$auth" -d '{"amount":250.50}' > /dev/null
          balance=$(curl -sf $api/accounts/$account -H "$auth" | jq -r .balance)
          test "$balance" = "250.5"

          second=$(curl -sf -X POST $api/accounts -H "$json" -H "$auth" -d '{"currency":"TRY"}' | jq -r .number)
          curl -sf -X POST $api/transfers -H "$json" -H "$auth" -d "{\"sourceAccountId\":\"$account\",\"destinationAccountNumber\":\"$second\",\"amount\":50}" > /dev/null
          balance=$(curl -sf $api/accounts/$account -H "$auth" | jq -r .balance)
          test "$balance" = "200.5"
          echo "Mini Banking API is up and moves money."

      - name: Show logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
